<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>五行轮回 · 烛龙囚笼</title>
  <link rel="stylesheet" href="css/reset.css?v=2" />
  <link rel="stylesheet" href="css/game-ui.css?v=3" />
  <link rel="stylesheet" href="css/animation.css?v=2" />
</head>
<body>
  <div class="wx-stage">
    <!-- 游戏画面容器：16:9 等比缩放定位层 -->
    <div id="game-container">
      <canvas id="game"></canvas>

      <!-- ★ loading 进度遮罩层 -->
      <div id="loading-overlay" class="loading-overlay show">
        <div class="loading-box">
          <div class="loading-bar-track">
            <div id="loading-bar-fill" class="loading-bar-fill"></div>
          </div>
          <div class="loading-info">
            <span id="loading-text">正在加载...</span>
            <span id="loading-pct">0%</span>
          </div>
        </div>
      </div>

      <!-- 操作说明 / 提示弹窗（DOM 层，基于 #game-container 绝对定位，随画面缩放） -->
      <div id="wx-dialog" class="wx-dialog">
        <div class="wx-dialog-box">
          <div class="wx-dialog-title"></div>
          <div class="wx-dialog-body"></div>
          <button class="wx-dialog-close">开始探索</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 工具 -->
  <script src="js/utils/MathTool.js?v=3"></script>
  <script src="js/utils/StorageUtil.js?v=3"></script>
  <script src="js/utils/FrameAnim.js?v=3"></script>
  <!-- 核心引擎 -->
  <script src="js/core/Collision.js?v=3"></script>
  <!-- ★ v5 实体碰撞系统 -->
  <script src="js/core/Entity.js?v=3"></script>
  <script src="js/core/CollisionManager.js?v=3"></script>
  <script src="js/core/AssetManager.js?v=3"></script>
  <script src="js/core/GameData.js?v=3"></script>
  <script src="js/core/SaveManager.js?v=3"></script>
  <!-- 核心：输入 -->
  <script src="js/core/InputManager.js?v=3"></script>
  <script src="js/core/Renderer.js?v=3"></script>
  <!-- ★ v4 战斗系统（在 GameMain 和 SkillSystem 之前加载） -->
  <script src="js/combat/HitboxSystem.js?v=3"></script>
  <script src="js/combat/SkillVFXRenderer.js?v=3"></script>
  <script src="js/core/GameMain.js?v=3"></script>
  <!-- 角色 -->
  <script src="js/player/PlayerAnimFSM.js?v=3"></script>
  <script src="js/player/PlayerRunFSM.js?v=3"></script>
  <script src="js/player/MolongAnimState.js?v=3"></script>
  <script src="js/player/JianrenAnimState.js?v=3"></script>
  <script src="js/player/Player.js?v=3"></script>
  <script src="js/player/SkillSystem.js?v=3"></script>
  <script src="js/player/ParrySystem.js?v=3"></script>
  <!-- 地图与陷阱 -->
  <script src="js/map/MapLoader.js?v=3"></script>
  <script src="js/map/trap/TrapBase.js?v=3"></script>
  <script src="js/map/trap/BoulderTrap.js?v=3"></script>
  <script src="js/map/trap/DragonTrap.js?v=3"></script>
  <script src="js/map/trap/FireWallTrap.js?v=3"></script>

  <script src="js/map/trap/IceGateTrap.js?v=3"></script>
  <script src="js/map/trap/LavaTrap.js?v=3"></script>
  <script src="js/map/trap/ThornTrap.js?v=3"></script>
  <script src="js/map/trap/ThornVineTrap.js?v=3"></script>


  <script src="js/map/TrapSystem.js?v=3"></script>
  <!-- 敌人 -->
  <script src="js/enemy/EnemyBase.js?v=3"></script>
  <script src="js/enemy/EnemyRockArmor.js?v=3"></script>
  <script src="js/enemy/EnemyIronSoldier.js?v=3"></script>
  <script src="js/enemy/EnemyEmberSpirit.js?v=3"></script>
  <script src="js/enemy/EnemyTideSpirit.js?v=3"></script>
  <script src="js/enemy/EnemyThornSeed.js?v=3"></script>
  <!-- 特效 -->
  <script src="js/effect/EffectPool.js?v=3"></script>
  <script src="js/effect/ShockWave.js?v=3"></script>
  <!-- UI -->
  <script src="js/ui/StatusBar.js?v=3"></script>
  <script src="js/ui/DialogBox.js?v=3"></script>
  <script src="js/ui/SkillPanel.js?v=3"></script>
  <script src="js/ui/UIManager.js?v=3"></script>
  <!-- 音频 -->
  <script src="js/audio/AudioList.js?v=3"></script>
  <script src="js/audio/AudioManager.js?v=3"></script>
</body>
</html>
