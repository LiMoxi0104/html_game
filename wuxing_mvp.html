<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五行·水行 - 横版动作游戏</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #2a2a2a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

#gameContainer {
    position: relative;
    width: 960px;
    height: 540px;
    background-color: #f5f0e6;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
</div>

<script>
// ==================== 常量定义 ====================
const CONSTANTS = {
    // 画布尺寸
    CANVAS_WIDTH: 960,
    CANVAS_HEIGHT: 540,
    
    // 颜色配置 (水墨国风)
    COLORS: {
        BG_PAPER: '#f5f0e6',      // 宣纸黄背景
        PLAYER_FILL: '#3a3a3a',   // 深灰玩家
        PLAYER_STROKE: '#1a1a1a', // 黑边框
        ENEMY_FILL: '#8b0000',    // 暗红怪物
        ENEMY_STROKE: '#5c0000',  // 深红边框
        WATER_BULLET: 'rgba(64, 164, 223, 0.7)', // 青色水弹
        GROUND_LINE: '#4a4a4a',   // 深灰地面线
        HP_BAR_BG: '#333333',     // 血条背景
        HP_BAR_FILL: '#cc0000',   // 血条填充(暗红)
        EXP_BAR_FILL: '#0066cc',  // 经验条填充(蓝色)
        TEXT_COLOR: '#1a1a1a',    // 文字颜色
        MOUNTAIN_INK: 'rgba(80, 70, 60, 0.15)', // 山峦淡墨
        WHITE_FLASH: 'rgba(255, 255, 255, 0.8)', // 屏幕闪白
        PARRY_WHITE: '#ffffff'    // 弹反白色状态
    },
    
    // 玩家属性
    PLAYER: {
        WIDTH: 40,
        HEIGHT: 60,
        X: 200,
        Y: 400,
        SPEED: 200,           // 移动速度 px/s
        JUMP_VELOCITY: -400,  // 跳跃初速度
        GRAVITY: 900,         // 重力加速度
        GROUND_Y: 400,        // 地面Y坐标
        MAX_HP: 100,
        MAX_EXP: 100
    },
    
    // 水行轻击属性
    WATER_ATTACK: {
        RADIUS: 8,
        SPEED: 400,           // 水弹速度 px/s
        DAMAGE: 30,
        LIFETIME: 1.0,        // 存在时间(秒)
        COOLDOWN: 0.4         // 冷却时间(秒)
    },
    
    // 弹反属性
    PARRY: {
        WINDOW_DURATION: 0.2, // 弹反窗口(秒)
        KNOCKBACK: 100,       // 击退距离(px)
        STUN_DURATION: 0.5,   // 怪物僵直(秒)
        FLASH_DURATION: 0.2,  // 屏幕闪白(秒)
        COOLDOWN: 1.5         // 冷却时间(秒)
    },
    
    // 怪物属性
    ENEMY: {
        WIDTH: 40,
        HEIGHT: 50,
        START_X: 600,
        START_Y: 400,
        PATROL_SPEED: 60,     // 巡逻速度 px/s
        CHASE_SPEED: 120,     // 追踪速度 px/s
        DETECTION_RANGE: 300, // 检测范围(px)
        ATTACK_RANGE: 60,     // 攻击范围(px)
        ATTACK_INTERVAL: 1.5, // 攻击间隔(秒)
        HP: 80,
        DAMAGE: 15,
        EXP_REWARD: 30        // 经验奖励
    },
    
    // UI属性
    UI: {
        HP_BAR_X: 20,
        HP_BAR_Y: 20,
        HP_BAR_WIDTH: 150,
        HP_BAR_HEIGHT: 15,
        EXP_BAR_HEIGHT: 10,
        FONT_SIZE: 16,
        FONT_FAMILY: 'SimSun, serif'
    },
    
    // 物理常量
    PHYSICS: {
        TARGET_FPS: 60,
        FIXED_TIMESTEP: 1 / 60
    }
};

// ==================== 游戏状态 ====================
const gameState = {
    // 玩家状态
    player: {
        x: CONSTANTS.PLAYER.X,
        y: CONSTANTS.PLAYER.Y,
        vx: 0,
        vy: 0,
        width: CONSTANTS.PLAYER.WIDTH,
        height: CONSTANTS.PLAYER.HEIGHT,
        facingRight: true,       // 朝向
        isGrounded: false,
        hp: CONSTANTS.PLAYER.MAX_HP,
        exp: 0,
        level: 1,
        
        // 技能状态
        waterCooldown: 0,
        isParrying: false,
        parryTimer: 0,
        parryCooldown: 0,
        isFlashingWhite: false,
        whiteFlashTimer: 0,
        invincibleTimer: 0,      // 受伤无敌时间
        lastHitBy: null          // 最后攻击来源(用于弹反判定)
    },
    
    // 输入状态
    input: {
        left: false,
        right: false,
        jump: false,
        waterAttack: false,
        parry: false
    },
    
    // 游戏对象数组
    waterBullets: [],
    enemies: [],
    
    // 屏幕特效
    screenFlash: 0,
    
    // 时间管理
    deltaTime: 0,
    lastTime: 0,
    accumulator: 0
};

// ==================== Canvas 初始化 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ==================== 工具函数 ====================

/**
 * 矩形与矩形碰撞检测
 */
function checkRectCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

/**
 * 圆形与矩形碰撞检测
 */
function checkCircleRectCollision(circle, rect) {
    const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
    const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
    const distanceX = circle.x - closestX;
    const distanceY = circle.y - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (circle.radius * circle.radius);
}

/**
 * 两点间水平距离
 */
function getHorizontalDistance(x1, x2) {
    return Math.abs(x1 - x2);
}

/**
 * 数值限制
 */
function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

// ==================== 怪物类 ====================
class Enemy {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = CONSTANTS.ENEMY.WIDTH;
        this.height = CONSTANTS.ENEMY.HEIGHT;
        this.hp = CONSTANTS.ENEMY.HP;
        this.maxHp = CONSTANTS.ENEMY.HP;
        this.state = 'patrol';      // patrol | chase | attack | stunned
        this.patrolDirection = 1;   // 1:右 -1:左
        this.attackTimer = 0;
        this.stunTimer = 0;
        this.knockbackVx = 0;
        this.originalX = x;
        this.isDead = false;
        this.deathTimer = 0;        // 死亡消失计时
    }
    
    update(dt, playerX) {
        if (this.isDead) {
            this.deathTimer += dt;
            return this.deathTimer >= 0.5; // 0.5秒后移除
        }
        
        // 僵直状态
        if (this.state === 'stunned') {
            this.stunTimer -= dt;
            // 击退效果
            this.x += this.knockbackVx * dt;
            this.knockbackVx *= 0.9; // 减速
            
            // 边界限制
            this.x = clamp(this.x, 0, CONSTANTS.CANVAS_WIDTH - this.width);
            
            if (this.stunTimer <= 0) {
                this.state = 'chase';
                this.knockbackVx = 0;
            }
            return false;
        }
        
        const distToPlayer = getHorizontalDistance(this.x + this.width/2, playerX + gameState.player.width/2);
        
        // 状态机
        switch(this.state) {
            case 'patrol':
                // 巡逻移动
                this.x += CONSTANTS.ENEMY.PATROL_SPEED * this.patrolDirection * dt;
                
                // 边界反弹或范围限制
                if (this.x <= this.originalX - 100 || 
                    this.x >= this.originalX + 100 ||
                    this.x <= 0 || 
                    this.x >= CONSTANTS.CANVAS_WIDTH - this.width) {
                    this.patrolDirection *= -1;
                }
                
                // 检测到玩家 -> 追踪
                if (distToPlayer < CONSTANTS.ENEMY.DETECTION_RANGE) {
                    this.state = 'chase';
                }
                break;
                
            case 'chase':
                // 追踪玩家
                const direction = (playerX > this.x) ? 1 : -1;
                this.x += CONSTANTS.ENEMY.CHASE_SPEED * direction * dt;
                
                // 边界限制
                this.x = clamp(this.x, 0, CONSTANTS.CANVAS_WIDTH - this.width);
                
                // 进入攻击范围 -> 攻击
                if (distToPlayer < CONSTANTS.ENEMY.ATTACK_RANGE) {
                    this.state = 'attack';
                    this.attackTimer = 0;
                }
                
                // 超出检测范围 -> 回到巡逻
                if (distToPlayer > CONSTANTS.ENEMY.DETECTION_RANGE * 1.5) {
                    this.state = 'patrol';
                }
                break;
                
            case 'attack':
                // 攻击冷却
                this.attackTimer += dt;
                if (this.attackTimer >= CONSTANTS.ENEMY.ATTACK_INTERVAL) {
                    // 造成伤害
                    if (!gameState.player.invincibleTimer > 0 && !gameState.player.isParrying) {
                        this.attackPlayer();
                    } else if (gameState.player.isParrying) {
                        // 弹反成功
                        this.onParrySuccess();
                    }
                    this.attackTimer = 0;
                    
                    // 攻击后根据距离决定下一步
                    if (distToPlayer > CONSTANTS.ENEMY.ATTACK_RANGE) {
                        this.state = 'chase';
                    }
                }
                break;
        }
        
        return false;
    }
    
    attackPlayer() {
        gameState.player.hp -= CONSTANTS.ENEMY.DAMAGE;
        gameState.player.hp = Math.max(0, gameState.player.hp);
        gameState.player.invincibleTimer = 0.5; // 无敌帧0.5秒
        gameState.player.lastHitBy = this;
    }
    
    onParrySuccess() {
        // 击退
        this.state = 'stunned';
        this.stunTimer = CONSTANTS.PARRY.STUN_DURATION;
        const knockDir = (this.x > gameState.player.x) ? 1 : -1;
        this.knockbackVx = CONSTANTS.PARRY.KNOCKBACK * knockDir;
        
        // 屏幕闪白
        gameState.screenFlash = CONSTANTS.PARRY.FLASH_DURATION;
    }
    
    takeDamage(damage) {
        this.hp -= damage;
        if (this.hp <= 0) {
            this.die();
        }
    }
    
    die() {
        this.isDead = true;
        this.deathTimer = 0;
        gameState.player.exp += CONSTANTS.ENEMY.EXP_REWARD;
        // 经验上限检查
        if (gameState.player.exp >= CONSTANTS.PLAYER.MAX_EXP) {
            gameState.player.exp = 0;
            gameState.player.level++;
            // 升级回血
            gameState.player.hp = Math.min(gameState.player.hp + 20, CONSTANTS.PLAYER.MAX_HP);
        }
    }
    
    draw(ctx) {
        if (this.isDead) {
            // 死亡渐隐
            ctx.globalAlpha = 1 - (this.deathTimer / 0.5);
        }
        
        // 绘制怪物身体
        ctx.fillStyle = CONSTANTS.COLORS.ENEMY_FILL;
        ctx.strokeStyle = CONSTANTS.COLORS.ENEMY_STROKE;
        ctx.lineWidth = 2;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.strokeRect(this.x, this.y, this.width, this.height);
        
        // 僵直状态闪烁效果
        if (this.state === 'stunned') {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.sin(Date.now() * 0.02) * 0.3 + 0.3})`;
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
        
        // 绘制血条
        if (!this.isDead) {
            const barWidth = this.width;
            const barHeight = 6;
            const barX = this.x;
            const barY = this.y - 12;
            
            // 背景
            ctx.fillStyle = CONSTANTS.COLORS.HP_BAR_BG;
            ctx.fillRect(barX, barY, barWidth, barHeight);
            
            // 血量
            const hpRatio = this.hp / this.maxHp;
            ctx.fillStyle = CONSTANTS.COLORS.HP_BAR_FILL;
            ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
            
            // 边框
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
        }
        
        ctx.globalAlpha = 1;
    }
}

// ==================== 水弹类 ====================
class WaterBullet {
    constructor(x, y, direction) {
        this.x = x;
        this.y = y;
        this.radius = CONSTANTS.WATER_ATTACK.RADIUS;
        this.vx = direction * CONSTANTS.WATER_ATTACK.SPEED;
        this.lifetime = CONSTANTS.WATER_ATTACK.LIFETIME;
        this.damage = CONSTANTS.WATER_ATTACK.DAMAGE;
        this.alive = true;
    }
    
    update(dt) {
        this.lifetime -= dt;
        if (this.lifetime <= 0) {
            this.alive = false;
            return;
        }
        
        // 移动
        this.x += this.vx * dt;
        
        // 边界检查
        if (this.x < -this.radius || this.x > CONSTANTS.CANVAS_WIDTH + this.radius) {
            this.alive = false;
        }
    }
    
    draw(ctx) {
        const alpha = Math.min(1, this.lifetime); // 渐隐效果
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(64, 164, 223, ${alpha * 0.7})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(40, 130, 180, ${alpha})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // 内部高光
        ctx.beginPath();
        ctx.arc(this.x - 2, this.y - 2, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 230, 255, ${alpha * 0.5})`;
        ctx.fill();
    }
    
    checkEnemyHit(enemy) {
        if (!this.alive || enemy.isDead) return false;
        
        return checkCircleRectCollision(
            { x: this.x, y: this.y, radius: this.radius },
            { x: enemy.x, y: enemy.y, width: enemy.width, height: enemy.height }
        );
    }
}

// ==================== 输入处理 ====================
function setupInputHandlers() {
    document.addEventListener('keydown', (e) => {
        switch(e.key.toLowerCase()) {
            case 'a':
            case 'arrowleft':
                gameState.input.left = true;
                break;
            case 'd':
            case 'arrowright':
                gameState.input.right = true;
                break;
            case 'w':
            case 'arrowup':
            case ' ':
                if (!e.repeat) {
                    gameState.input.jump = true;
                }
                break;
            case 'j':
                if (!e.repeat) {
                    gameState.input.waterAttack = true;
                }
                break;
            case 'l':
                if (!e.repeat) {
                    gameState.input.parry = true;
                }
                break;
        }
    });
    
    document.addEventListener('keyup', (e) => {
        switch(e.key.toLowerCase()) {
            case 'a':
            case 'arrowleft':
                gameState.input.left = false;
                break;
            case 'd':
            case 'arrowright':
                gameState.input.right = false;
                break;
            case 'w':
            case 'arrowup':
            case ' ':
                gameState.input.jump = false;
                break;
        }
    });
}

// ==================== 玩家更新逻辑 ====================
function updatePlayer(dt) {
    const p = gameState.player;
    const input = gameState.input;
    const consts = CONSTANTS.PLAYER;
    
    // ===== 水平移动 =====
    p.vx = 0;
    if (input.left) {
        p.vx = -consts.SPEED;
        p.facingRight = false;
    }
    if (input.right) {
        p.vx = consts.SPEED;
        p.facingRight = true;
    }
    
    // 应用速度
    p.x += p.vx * dt;
    
    // 左右边界限制
    p.x = clamp(p.x, 0, CONSTANTS.CANVAS_WIDTH - p.width);
    
    // ===== 重力 & 跳跃 =====
    if (input.jump && p.isGrounded) {
        p.vy = consts.JUMP_VELOCITY;
        p.isGrounded = false;
        input.jump = false; // 消耗跳跃输入
    }
    
    if (!p.isGrounded) {
        p.vy += consts.GRAVITY * dt;
    }
    
    p.y += p.vy * dt;
    
    // 地面碰撞
    if (p.y >= consts.GROUND_Y) {
        p.y = consts.GROUND_Y;
        p.vy = 0;
        p.isGrounded = true;
    }
    
    // ===== 技能冷却更新 =====
    if (p.waterCooldown > 0) {
        p.waterCooldown -= dt;
    }
    if (p.parryCooldown > 0) {
        p.parryCooldown -= dt;
    }
    if (p.invincibleTimer > 0) {
        p.invincibleTimer -= dt;
    }
    
    // ===== 弹反窗口更新 =====
    if (p.isParrying) {
        p.parryTimer -= dt;
        if (p.parryTimer <= 0) {
            p.isParrying = false;
        }
    }
    
    // ===== 屏幕闪白更新 =====
    if (gameState.screenFlash > 0) {
        gameState.screenFlash -= dt;
    }
    
    // ===== 处理技能输入 =====
    handleSkillInputs(dt);
}

function handleSkillInputs(dt) {
    const p = gameState.player;
    
    // 水行轻击 (J键)
    if (gameState.input.waterAttack) {
        if (p.waterCooldown <= 0) {
            // 创建水弹
            const bulletX = p.facingRight ? 
                p.x + p.width + 5 : 
                p.x - 5;
            const bulletY = p.y + p.height / 2;
            const direction = p.facingRight ? 1 : -1;
            
            gameState.waterBullets.push(new WaterBullet(bulletX, bulletY, direction));
            p.waterCooldown = CONSTANTS.WATER_ATTACK.COOLDOWN;
        }
        gameState.input.waterAttack = false;
    }
    
    // 弹反 (L键)
    if (gameState.input.parry) {
        if (p.parryCooldown <= 0 && !p.isParrying) {
            p.isParrying = true;
            p.paritymer = CONSTANTS.PARRY.WINDOW_DURATION;
            p.parryCooldown = CONSTANTS.PARRY.COOLDOWN;
        }
        gameState.input.parry = false;
    }
}

// ==================== 子弹更新逻辑 ====================
function updateWaterBullets(dt) {
    for (let i = gameState.waterBullets.length - 1; i >= 0; i--) {
        const bullet = gameState.waterBullets[i];
        bullet.update(dt);
        
        // 检查与敌人的碰撞
        for (const enemy of gameState.enemies) {
            if (bullet.checkEnemyHit(enemy)) {
                enemy.takeDamage(bullet.damage);
                bullet.alive = false;
                break;
            }
        }
        
        // 移除失效子弹
        if (!bullet.alive) {
            gameState.waterBullets.splice(i, 1);
        }
    }
}

// ==================== 敌人更新逻辑 ====================
function updateEnemies(dt) {
    for (let i = gameState.enemies.length - 1; i >= 0; i--) {
        const enemy = gameState.enemies[i];
        const shouldRemove = enemy.update(dt, gameState.player.x);
        
        if (shouldRemove) {
            gameState.enemies.splice(i, 1);
        }
    }
}

// ==================== 渲染函数 ====================

/** 
 * 绘制背景 (宣纸色 + 淡墨山峦)
 */
function drawBackground() {
    // 宣纸背景
    ctx.fillStyle = CONSTANTS.COLORS.BG_PAPER;
    ctx.fillRect(0, 0, CONSTANTS.CANVAS_WIDTH, CONSTANTS.CANVAS_HEIGHT);
    
    // 淡墨山峦 (贝塞尔曲线)
    ctx.fillStyle = CONSTANTS.COLORS.MOUNTAIN_INK;
    ctx.beginPath();
    ctx.moveTo(0, 440);
    
    // 远山
    ctx.bezierCurveTo(120, 350, 240, 380, 360, 340);
    ctx.bezierCurveTo(480, 300, 600, 360, 720, 330);
    ctx.bezierCurveTo(840, 300, 900, 350, 960, 370);
    ctx.lineTo(960, 440);
    ctx.closePath();
    ctx.fill();
    
    // 近山
    ctx.fillStyle = 'rgba(80, 70, 60, 0.22)';
    ctx.beginPath();
    ctx.moveTo(0, 440);
    ctx.bezierCurveTo(80, 390, 200, 410, 320, 385);
    ctx.bezierCurveTo(450, 355, 550, 395, 680, 375);
    ctx.bezierCurveTo(800, 355, 880, 390, 960, 400);
    ctx.lineTo(960, 440);
    ctx.closePath();
    ctx.fill();
}

/**
 * 绘制地面
 */
function drawGround() {
    ctx.strokeStyle = CONSTANTS.COLORS.GROUND_LINE;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 440);
    ctx.lineTo(CONSTANTS.CANVAS_WIDTH, 440);
    ctx.stroke();
}

/**
 * 绘制玩家
 */
function drawPlayer() {
    const p = gameState.player;
    
    ctx.save();
    
    // 受伤无敌闪烁
    if (p.invincibleTimer > 0) {
        ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.02) * 0.3;
    }
    
    // 弹反时变白
    if (p.isParrying) {
        ctx.fillStyle = CONSTANTS.COLORS.PARRY_WHITE;
        ctx.strokeStyle = '#cccccc';
    } else {
        ctx.fillStyle = CONSTANTS.COLORS.PLAYER_FILL;
        ctx.strokeStyle = CONSTANTS.COLORS.PLAYER_STROKE;
    }
    
    ctx.lineWidth = 2;
    
    // 绘制玩家矩形
    ctx.fillRect(p.x, p.y, p.width, p.height);
    ctx.strokeRect(p.x, p.y, p.width, p.height);
    
    // 绘制朝向指示器 (眼睛方向)
    ctx.fillStyle = p.isParrying ? '#dddddd' : '#666666';
    const eyeX = p.facingRight ? p.x + p.width - 10 : p.x + 5;
    ctx.beginPath();
    ctx.arc(eyeX, p.y + 15, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

/**
 * 绘制UI
 */
function drawUI() {
    const ui = CONSTANTS.UI;
    const p = gameState.player;
    
    ctx.font = `${ui.FONT_SIZE}px ${ui.FONT_FAMILY}`;
    ctx.textBaseline = 'top';
    
    // ===== 生命值条 =====
    const hpBarX = ui.HP_BAR_X;
    const hpBarY = ui.HP_BAR_Y;
    
    // 标签文字
    ctx.fillStyle = CONSTANTS.COLORS.TEXT_COLOR;
    ctx.fillText(`生命：${Math.ceil(p.hp)}/${CONSTANTS.PLAYER.MAX_HP}`, hpBarX, hpBarY - 18);
    
    // 血条背景
    ctx.fillStyle = CONSTANTS.COLORS.HP_BAR_BG;
    ctx.fillRect(hpBarX, hpBarY, ui.HP_BAR_WIDTH, ui.HP_BAR_HEIGHT);
    
    // 血条填充
    const hpRatio = p.hp / CONSTANTS.PLAYER.MAX_HP;
    ctx.fillStyle = CONSTANTS.COLORS.HP_BAR_FILL;
    ctx.fillRect(hpBarX, hpBarY, ui.HP_BAR_WIDTH * hpRatio, ui.HP_BAR_HEIGHT);
    
    // 血条边框
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    ctx.strokeRect(hpBarX, hpBarY, ui.HP_BAR_WIDTH, ui.HP_BAR_HEIGHT);
    
    // ===== 经验值条 =====
    const expBarY = hpBarY + ui.HP_BAR_HEIGHT + 5;
    
    // 标签文字
    ctx.fillText(`经验：${p.exp}/${CONSTANTS.PLAYER.MAX_EXP}  Lv.${p.level}`, hpBarX, expBarY - 18);
    
    // 经验条背景
    ctx.fillStyle = CONSTANTS.COLORS.HP_BAR_BG;
    ctx.fillRect(hpBarX, expBarY, ui.HP_BAR_WIDTH, ui.EXP_BAR_HEIGHT);
    
    // 经验条填充
    const expRatio = p.exp / CONSTANTS.PLAYER.MAX_EXP;
    ctx.fillStyle = CONSTANTS.COLORS.EXP_BAR_FILL;
    ctx.fillRect(hpBarX, expBarY, ui.HP_BAR_WIDTH * expRatio, ui.EXP_BAR_HEIGHT);
    
    // 经验条边框
    ctx.strokeRect(hpBarX, expBarY, ui.HP_BAR_WIDTH, ui.EXP_BAR_HEIGHT);
    
    // ===== 技能冷却提示 =====
    const hintY = expBarY + ui.EXP_BAR_HEIGHT + 20;
    ctx.font = '14px SimSun, serif';
    
    // 水攻冷却
    const waterHint = p.waterCooldown > 0 ? 
        `[J] 水行 ${p.waterCooldown.toFixed(1)}s` : 
        `[J] 水行 就绪`;
    ctx.fillStyle = p.waterCooldown <= 0 ? '#0066aa' : '#888888';
    ctx.fillText(waterHint, hpBarX, hintY);
    
    // 弹反冷却
    const parryHint = p.parryCooldown > 0 ?
        `[L] 弹反 ${p.parryCooldown.toFixed(1)}s` :
        `[L] 弹反 就绪`;
    ctx.fillStyle = p.parryCooldown <= 0 ? '#0066aa' : '#888888';
    ctx.fillText(parryHint, hpBarX, hintY + 20);
    
    // 弹反窗口提示
    if (p.isParrying) {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        const windowText = '⚡ 弹反窗口!';
        const textWidth = ctx.measureText(windowText).width;
        const textX = (CONSTANTS.CANVAS_WIDTH - textWidth) / 2;
        const textY = CONSTANTS.CANVAS_HEIGHT / 2 - 50;
        ctx.strokeText(windowText, textX, textY);
        ctx.fillText(windowText, textX, textY);
    }
}

/**
 * 绘制屏幕闪白效果
 */
function drawScreenFlash() {
    if (gameState.screenFlash > 0) {
        const alpha = Math.min(1, gameState.screenFlash * 5); // 快进慢出
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fillRect(0, 0, CONSTANTS.CANVAS_WIDTH, CONSTANTS.CANVAS_HEIGHT);
    }
}

/**
 * 绘制子弹
 */
function drawWaterBullets() {
    for (const bullet of gameState.waterBullets) {
        bullet.draw(ctx);
    }
}

/**
 * 绘制敌人
 */
function drawEnemies() {
    for (const enemy of gameState.enemies) {
        enemy.draw(ctx);
    }
}

// ==================== 主渲染函数 ====================
function render() {
    // 清空画布
    ctx.clearRect(0, 0, CONSTANTS.CANVAS_WIDTH, CONSTANTS.CANVAS_HEIGHT);
    
    // 按层绘制
    drawBackground();
    drawGround();
    drawEnemies();
    drawPlayer();
    drawWaterBullets();
    drawUI();
    drawScreenFlash();
}

// ==================== 游戏循环 ====================
function gameLoop(currentTime) {
    // 计算deltaTime
    if (gameState.lastTime === 0) {
        gameState.lastTime = currentTime;
    }
    gameState.deltaTime = (currentTime - gameState.lastTime) / 1000;
    gameState.lastTime = currentTime;
    
    // 防止大跳跃 (标签页切换等情况)
    if (gameState.deltaTime > 0.1) {
        gameState.deltaTime = CONSTANTS.PHYSICS.FIXED_TIMESTEP;
    }
    
    // 固定时间步长更新
    gameState.accumulator += gameState.deltaTime;
    while (gameState.accumulator >= CONSTANTS.PHYSICS.FIXED_TIMESTEP) {
        update(CONSTANTS.PHYSICS.FIXED_TIMESTEP);
        gameState.accumulator -= CONSTANTS.PHYSICS.FIXED_TIMESTEP;
    }
    
    // 渲染
    render();
    
    // 继续循环
    requestAnimationFrame(gameLoop);
}

/**
 * 更新逻辑
 */
function update(dt) {
    updatePlayer(dt);
    updateWaterBullets(dt);
    updateEnemies(dt);
    
    // 检查是否需要重生敌人
    if (gameState.enemies.length === 0) {
        spawnEnemy();
    }
    
    // 检查玩家死亡
    if (gameState.player.hp <= 0) {
        onPlayerDeath();
    }
}

/**
 * 生成敌人
 */
function spawnEnemy() {
    const enemy = new Enemy(
        CONSTANTS.ENEMY.START_X,
        CONSTANTS.ENEMY.START_Y
    );
    // 随机位置偏移，避免太固定
    enemy.originalX = 500 + Math.random() * 200;
    enemy.x = enemy.originalX;
    gameState.enemies.push(enemy);
}

/**
 * 玩家死亡处理
 */
function onPlayerDeath() {
    // 简单的重生机制
    gameState.player.hp = CONSTANTS.PLAYER.MAX_HP;
    gameState.player.x = CONSTANTS.PLAYER.X;
    gameState.player.y = CONSTANTS.PLAYER.Y;
    gameState.player.vx = 0;
    gameState.player.vy = 0;
    gameState.player.isGrounded = true;
    gameState.player.exp = 0; // 死亡掉经验
    
    // 清空场景
    gameState.waterBullets = [];
    gameState.enemies = [];
    spawnEnemy();
}

// ==================== 初始化与启动 ====================
function initGame() {
    console.log('五行·水行 - 游戏初始化');
    
    // 设置输入监听
    setupInputHandlers();
    
    // 生成初始敌人
    spawnEnemy();
    
    // 启动游戏循环
    requestAnimationFrame(gameLoop);
}

// 页面加载完成后启动
window.onload = initGame;
</script>
</body>
</html>
